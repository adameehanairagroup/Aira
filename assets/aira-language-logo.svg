<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan Sovereign Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <!-- Radiant Purple/Magenta Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <!-- Gold Crown Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield (Transparent / Subtle Dark) -->
  <rect width="512" height="512" rx="110" fill="#0B0F19" />
  
  <!-- Outer Circuit Ring Accent -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="14 10" opacity="0.35" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#purpleGrad)" stroke-width="2" opacity="0.25" />

  <!-- INTERTWINED AIRA EMBLEM (Twin Cyber Serpents / Neural Wings forming 'A') -->
  <g transform="translate(256, 256)">
    <!-- LEFT WING / SERPENT (Cyan Sovereign) -->
    <path d="M -25 -145 
             C -90 -145 -145 -90 -145 -25 
             C -145 40 -105 85 -55 105 
             L -55 45 
             C -80 30 -95 5 -95 -25 
             C -95 -65 -65 -95 -25 -95 
             L 25 -95 
             L 25 -145 
             Z" 
          fill="url(#cyanGrad)" filter="url(#glow)" />
    
    <!-- Left Neural Node (Eye) -->
    <circle cx="-50" cy="-70" r="14" fill="#FFFFFF" />
    <circle cx="-50" cy="-70" r="7" fill="#0072FF" />

    <!-- RIGHT WING / SERPENT (Purple Radiant) - 180° Interlocked -->
    <path d="M 25 145 
             C 90 145 145 90 145 25 
             C 145 -40 105 -85 55 -105 
             L 55 -45 
             C 80 -30 95 -5 95 25 
             C 95 65 65 95 25 95 
             L -25 95 
             L -25 145 
             Z" 
          fill="url(#purpleGrad)" filter="url(#glow)" />

    <!-- Right Neural Node (Eye) -->
    <circle cx="50" cy="70" r="14" fill="#FFFFFF" />
    <circle cx="50" cy="70" r="7" fill="#9333EA" />

    <!-- CENTRAL SOVEREIGN QUANTUM BRIDGE (The "A" Crossbar / Core AI Node) -->
    <path d="M -50 -10 L 50 -10 L 35 15 L -35 15 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="2" r="11" fill="#FFFFFF" />
    <circle cx="0" cy="2" r="6" fill="#F59E0B" />
  </g>

  <!-- Typography Accent: AIRA -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="9">AIRA</text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#00F0FF" text-anchor="middle" letter-spacing="4">SOVEREIGN AI LANGUAGE</text>
</svg>
